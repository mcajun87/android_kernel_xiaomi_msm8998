name: Build Kernel for Chiron (LineageOS 23.2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4
        with:
          ref: lineage-23.2

      # 2. 安装依赖
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libelf-dev

      # 3. 下载 Android 16 正式版 Clang
      - name: Download Google Clang (Android 16 Stable)
        run: |
          echo "Downloading Clang for Android 16..."
          # 使用 android16-release 分支，这是 Android 16 的正式分支
          git clone --depth 1 --branch android16-release https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang

      # 4. 编译内核
      - name: Build kernel
        run: |
          # --- 环境变量设置 ---
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          # 将 Google Clang 加入 PATH
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          
          # 验证 Clang 版本
          echo "Using Clang version:"
          clang --version

          # --- 生成配置 ---
          # 注意：KCONFIG_ALLCONFIG 指向你的 defconfig 文件
          make KCONFIG_ALLCONFIG=arch/arm64/configs/vendor/xiaomi/chiron.config defconfig

          # --- 开始编译 ---
          # 使用 LLVM=1 开启纯 Clang 编译模式
          make -j$(nproc) LLVM=1 Image.gz-dtb

      # 5. 上传内核镜像
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-chiron
          path: arch/arm64/boot/Image.gz-dtb
