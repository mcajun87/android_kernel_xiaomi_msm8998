name: Build Kernel for Chiron (LineageOS 23.2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4
        with:
          ref: lineage-23.2

      # 2. 安装依赖 (包含 GCC 交叉编译工具链)
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make libssl-dev libelf-dev libncurses-dev flex bison

      # 3. 下载 GCC 交叉编译工具链 (推荐使用 Android 源码中的 AOSP 工具链)
      - name: Download AOSP GCC
        run: |
          cd ${GITHUB_WORKSPACE}
          # 下载 AOSP 官方预编译的 GCC (支持 ARM64)
          wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android13-release.tar.gz
          tar -xzf android13-release.tar.gz
          rm android13-release.tar.gz

      # 4. 编译内核
      - name: Build Kernel
        run: |
          # --- 环境变量设置 ---
          # 1. 设置 GCC 路径 (注意：使用 aarch64-linux-android-gcc 的路径)
          # 这里的 gcc 二进制文件通常在 bin 目录下
          export PATH="${GITHUB_WORKSPACE}/aarch64-linux-android-4.9/bin:${PATH}"
          
          # 2. 设置架构
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 3. 设置交叉编译前缀 (非常重要)
          export CROSS_COMPILE=aarch64-linux-android-

          # 验证是否找到正确的 GCC
          echo "Using Compiler:"
          ${CROSS_COMPILE}gcc --version

          # --- 生成配置 ---
          # 使用 Chiron (小米 MIX 2) 的专用配置
          make O=out KCONFIG_ALLCONFIG=arch/arm64/configs/vendor/xiaomi/chiron.config defconfig

          # --- 开始编译 ---
          # 编译 Image.gz-dtb
          make O=out -j$(nproc) Image.gz-dtb
