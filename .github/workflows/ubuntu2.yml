name: Build Kernel for Chiron (LineageOS 23.2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4
        with:
          ref: lineage-23.2

      # 2. 安装基础依赖 (仅安装 GCC 工具链，Clang 由 Google 提供)
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      # 3. 下载 Google Clang 并编译内核
      # 注意：将下载和编译放在同一步，以确保 PATH 环境变量生效
      - name: Setup Clang & Build Kernel
        run: |
          # 定义变量
          ARCH=arm64
          CROSS_COMPILE=aarch64-linux-gnu-
          CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 1. 下载 Google 官方 Clang (使用正确的 git-archive 链接)
          # 这是 Android 官方推荐的下载方式
          echo "Downloading Google Clang..."
          wget -O clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android15-release/clang-r525760d.tar.gz
          
          # 2. 创建目录并解压
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang --strip-components=1
          rm clang.tar.gz
          
          # 3. 将 Clang 添加到 PATH 环境变量
          # 注意：这行代码必须和编译命令在同一块，否则环境变量不生效
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          
          # 4. 验证 Clang 是否安装成功
          clang --version || { echo "Clang not found!"; exit 1; }

          # 5. 生成配置 (关键：defconfig 放在最后)
          # 语法：make [变量定义] <目标>
          make KCONFIG_ALLCONFIG=arch/arm64/configs/vendor/xiaomi/chiron.config ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} CC=clang CLANG_TRIPLE=${CLANG_TRIPLE} defconfig

          # 6. 开始编译
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} CC=clang CLANG_TRIPLE=${CLANG_TRIPLE} -j$(nproc) Image.gz-dtb

      # 4. 上传产物
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-chiron
          path: arch/arm64/boot/Image.gz-dtb
