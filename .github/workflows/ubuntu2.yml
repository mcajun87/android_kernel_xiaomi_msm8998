name: Build Xiaomi MIX 2 (chiron) 4.4 Kernel

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: '内核版本后缀（如 v1.0）'
        default: 'mix2-4.4-custom'

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies for kernel 4.4
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev rsync \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

    - name: Build kernel 4.4
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        make clean
        make chiron_defconfig
        make -j$(nproc) Image.gz-dtb

        if [ ! -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "Build failed"
          exit 1
        fi

    - name: Pack with AnyKernel3 (chiron)
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AK3
        cd AK3
        cp ../arch/arm64/boot/Image.gz-dtb zImage
        zip -r9 ../MIX2-Kernel-4.4-${{ inputs.suffix }}.zip ./*

    - name: Upload kernel zip
      uses: actions/upload-artifact@v3
      with:
        name: MIX2-Kernel-4.4-${{ inputs.suffix }}
        path: "MIX2-Kernel-*.zip"

