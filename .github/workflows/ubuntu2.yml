name: Build Kernel for Chiron (LineageOS 23.2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4
        with:
          ref: lineage-23.2

      # 2. 安装基础依赖
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libelf-dev

      # 3. 下载 Google Clang (Android 16)
      - name: Download Google Clang (Android 16 Stable)
        run: |
          # 创建预编译目录
          mkdir -p ${GITHUB_WORKSPACE}/prebuilts/clang/host/linux-x86
          # 进入目录
          cd ${GITHUB_WORKSPACE}/prebuilts/clang/host/linux-x86
          # 下载 Android 16 的 Clang (r547379)
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-release/clang-r547379.tar.gz
          # 解压
          tar -xzf clang-r547379.tar.gz
          # 清理压缩包
          rm clang-r547379.tar.gz

      # 4. 编译内核
      - name: Build Kernel
        run: |
          # --- 环境变量设置 ---
          # 1. 将 Google Clang 的 bin 目录添加到 PATH 的最前面
          export PATH="${GITHUB_WORKSPACE}/prebuilts/clang/host/linux-x86/clang-r547379/bin:${PATH}"
          # 2. 设置架构
          export ARCH=arm64
          export SUBARCH=arm64
          # 3. 开启 LLVM 模式
          export LLVM=1

          # 验证是否找到正确的 Clang
          echo "Using Clang version:"
          clang --version

          # --- 生成配置 ---
          # 关键修正：路径必须包含 "vendor"
          # 使用 KCONFIG_ALLCONFIG 指向 .config 文件
          make O=out KCONFIG_ALLCONFIG=arch/arm64/configs/vendor/xiaomi/chiron.config defconfig

          # --- 开始编译 ---
          # 编译 Image.gz-dtb
          make O=out -j$(nproc) Image.gz-dtb
