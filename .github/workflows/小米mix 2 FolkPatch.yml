name: Build MIX2 4.4 Kernel - FolkPatch Only

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: '版本后缀 (如: v1.0-forkpatch)'
        required: true
        default: 'mix2-forkpatch'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make gcc-aarch64-linux-gnu zip git

      - name: Integrate ForkPatch (only)
        run: |
          git clone https://github.com/0x7f9fa/ForkPatch --depth=1
          mkdir -p drivers/forkpatch
          cp -r ForkPatch/kernel/ForkPatch/* drivers/forkpatch/
          echo "CONFIG_FORKPATCH=y" >> arch/arm64/configs/chiron_defconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make clean
          make chiron_defconfig
          make -j$(nproc) Image.gz-dtb

      - name: Pack with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b chiron --depth=1
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/zImage
          cd AnyKernel3
          zip -r9 ../MIX2-Kernel-ForkPatch-${{ inputs.suffix }}.zip .

      - name: Upload zip
        uses: actions/upload-artifact@v3
        with:
          name: MIX2-Kernel-ForkPatch-${{ inputs.suffix }}
          path: "MIX2-Kernel-ForkPatch-*.zip"

