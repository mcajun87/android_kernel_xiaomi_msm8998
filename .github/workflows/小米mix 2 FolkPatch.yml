name: Build MIX2 4.4 Kernel - FolkPatch Only

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: '版本后缀'
        required: true
        default: 'mix2-folkpatch'

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y bc bison flex libssl-dev make gcc-aarch64-linux-gnu zip git

      - name: Integrate FolkPatch
        run: |
          git clone https://github.com/matsuzaka-yuki/FolkPatch --depth=1
          cp -r FolkPatch/kernel_apatch include/
          cp -r FolkPatch/drivers/apatch drivers/
          echo "CONFIG_APATCH=y" >> arch/arm64/configs/chiron_defconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make clean
          make chiron_defconfig
          make -j$(nproc) Image.gz-dtb

      - name: Pack with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b chiron --depth=1
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/zImage
          cd AnyKernel3
          zip -r9 ../MIX2-Kernel-FolkPatch-${{ inputs.suffix }}.zip .

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: MIX2-FolkPatch-${{ inputs.suffix }}
          path: "MIX2-Kernel-FolkPatch-*.zip"

