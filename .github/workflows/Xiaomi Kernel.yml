name: Build chiron Kernel (LineageOS 23.2 & APatch Ready) - Clang 14

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: '内核配置文件'
        default: 'msm-perf_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🛠️ 安装依赖
        run: |
          sudo apt update -y
          sudo apt install -y bc bison flex libssl-dev libelf-dev \
          make gcc-aarch64-linux-gnu git wget libncurses5-dev \
          libncursesw5-dev xz-utils liblz4-tool libtinfo5

      - name: 📥 下载并配置 Clang 14（更稳定的版本）
        run: |
          wget -qO- https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz | tar -xJf -
          mv clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04 clang-14
          echo "PATH=$PWD/clang-14/bin:$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$PWD/clang-14/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: 📥 下载并编译 mkbootimg
        run: |
          git clone --depth=1 https://github.com/osm0sis/mkbootimg.git
          cd mkbootimg
          make CC=gcc
          sudo cp mkbootimg /usr/local/bin/
          cd .. && rm -rf mkbootimg

      - name: 📥 下载 LineageOS ramdisk
        run: |
          wget -O ramdisk.cpio "https://raw.githubusercontent.com/mcajun87/android_kernel_xiaomi_msm8998/lineage-23.2/.github/ramdisk.cpio"

      - name: ⚙️ 配置并编译内核（方案二：Clang 14 + 保留 BTF）
        run: |
          # 1. 加载默认配置
          make O=out ARCH=arm64 HOSTCC=gcc ${{ github.event.inputs.defconfig }}
          
          # 2. 配置 APatch 选项（保留所有选项，包括 BTF）
          scripts/config --file out/.config -e CONFIG_KALLSYMS
          scripts/config --file out/.config -e CONFIG_KALLSYMS_ALL
          scripts/config --file out/.config -e CONFIG_MODULES
          scripts/config --file out/.config -e CONFIG_MODULE_SIG_FORCE
          scripts/config --file out/.config -e CONFIG_FTRACE
          scripts/config --file out/.config -e CONFIG_KPROBES
          scripts/config --file out/.config -e CONFIG_DEBUG_INFO
          scripts/config --file out/.config -e CONFIG_DEBUG_INFO_DWARF4
          scripts/config --file out/.config -e CONFIG_DEBUG_INFO_BTF  # 保留，因为 Clang 14 兼容性更好
          
          # 3. 自动处理配置
          make O=out ARCH=arm64 HOSTCC=gcc olddefconfig
          
          # 4. 显示编译器版本和配置
          echo "🔍 Clang 版本:"
          clang --version | head -1
          echo "🔍 BPF 配置状态:"
          grep -E "CONFIG_BPF|CONFIG_DEBUG_INFO_BTF" out/.config || echo "未找到相关配置"
          
          # 5. 编译内核
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz dtbs

      - name: 📦 打包 boot.img
        run: |
          mkdtimg create out/arch/arm64/boot/dtb.img out/arch/arm64/boot/dts/qcom/*.dtb
          mkbootimg \
            --kernel out/arch/arm64/boot/Image.gz \
            --dtb out/arch/arm64/boot/dtb.img \
            --ramdisk ./ramdisk.cpio \
            --cmdline "androidboot.console=ttyMSM0 androidboot.hardware=qcom androidboot.boot_devices=soc/1da4000.ufshc msm_rtb.filter=0x37 ehci-hcd.park=3 service_locator.enable=1 swiotlb=2048 loop.max_part=7" \
            --base 0x00000000 \
            --pagesize 4096 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --kernel_offset 0x00008000 \
            --os_version 16.0.0 \
            --os_patch_level 2026-02 \
            --header_version 2 \
            --board chiron \
            -o out/arch/arm64/boot/boot.img

      - name: 📤 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chiron-lineage23.2-apatch-clang14-boot.img
          path: out/arch/arm64/boot/boot.img
