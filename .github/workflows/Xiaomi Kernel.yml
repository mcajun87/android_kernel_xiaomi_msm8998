name: Build Xiaomi MIX 2 (chiron) 4.4 Kernel

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: '版本后缀'
        required: true
        default: 'mix2-stock'

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y bc bison flex libssl-dev make gcc-aarch64-linux-gnu zip git

      - name: Build kernel (ONLY for MIX2 chiron)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make clean
          make vendor/xiaomi/chiron_defconfig
          make -j$(nproc) Image.gz-dtb

      - name: Pack with AnyKernel3 (ONLY for MIX2 chiron)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b chiron --depth=1
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/zImage
          cd AnyKernel3
          zip -r9 ../MIX2-Kernel-Stock-${{ inputs.suffix }}.zip .

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: MIX2-Stock-${{ inputs.suffix }}
          path: "MIX2-Kernel-Stock-*.zip"
