name: MIX 2 (chiron) 4.4 Kernel

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: '版本后缀'
        required: true
        default: 'mix2-stock'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y bc bison flex libssl-dev make gcc-aarch64-linux-gnu zip git clang lld

      - name: Build kernel (ONLY for MIX2 chiron)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld

          make vendor/xiaomi/chiron_defconfig
          make -j$(nproc) Image.gz-dtb

      - name: Pack with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../MIX2-Kernel-${{ inputs.suffix }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIX2-Kernel-${{ inputs.suffix }}
          path: "MIX2-Kernel-*.zip"
