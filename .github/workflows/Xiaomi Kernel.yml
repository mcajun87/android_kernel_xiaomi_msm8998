name: Build chiron Kernel - 修复版

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: '内核配置文件'
        default: 'vendor/xiaomi/chiron.config'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🛠️ 安装依赖
        run: |
          sudo apt update -y
          sudo apt install -y bc bison flex libssl-dev libelf-dev \
          make gcc-12-aarch64-linux-gnu git wget libncurses5-dev \
          libncursesw5-dev xz-utils liblz4-tool libtinfo5 cpio \
          device-tree-compiler
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-12 100

      - name: 📥 下载 mkbootimg
        run: |
          git clone --depth=1 https://github.com/osm0sis/mkbootimg.git
          cd mkbootimg
          make CC=gcc
          sudo cp mkbootimg /usr/local/bin/
          cd .. && rm -rf mkbootimg

      - name: 📥 下载 LineageOS ramdisk
        run: |
          wget -O ramdisk.cpio "https://raw.githubusercontent.com/mcajun87/android_kernel_xiaomi_msm8998/lineage-23.2/.github/ramdisk.cpio"

      - name: ⚙️ 配置内核
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 加载配置
          make O=out ${{ github.event.inputs.defconfig }}
          
          # 开启 APatch 选项
          scripts/config --file out/.config -e CONFIG_KALLSYMS
          scripts/config --file out/.config -e CONFIG_KALLSYMS_ALL
          scripts/config --file out/.config -e CONFIG_MODULES
          
          # 禁用 BPF
          scripts/config --file out/.config -d CONFIG_BPF
          scripts/config --file out/.config -d CONFIG_BPF_SYSCALL
          scripts/config --file out/.config -d CONFIG_DEBUG_INFO_BTF
          
          # 自动处理
          make O=out olddefconfig

      - name: ⚙️ 编译内核和模块
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 编译内核镜像
          make O=out -j$(nproc) Image
          
          # 如果 Image 存在，压缩它
          if [ -f out/arch/arm64/boot/Image ]; then
            gzip -9 -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.gz
            echo "✅ Image.gz 创建成功"
          else
            echo "❌ Image 未生成"
            # 尝试直接编译 Image.gz
            make O=out -j$(nproc) Image.gz
          fi
          
          # 编译 DTB
          make O=out -j$(nproc) dtbs

      - name: 📦 检查编译产物
        run: |
          echo "=== 检查内核镜像 ==="
          ls -la out/arch/arm64/boot/Image* || echo "内核镜像不存在"
          
          echo "=== 检查 DTB 文件 ==="
          find out -name "*.dtb" | head -20 || echo "DTB 文件不存在"
          
          # 如果内核不存在，显示最后100行日志
          if [ ! -f out/arch/arm64/boot/Image.gz ] && [ ! -f out/arch/arm64/boot/Image ]; then
            echo "=== 最后100行编译日志 ==="
            tail -100 nohup.out 2>/dev/null || tail -100 build.log 2>/dev/null || echo "无日志"
            exit 1
          fi

      - name: 📦 打包 dtb.img
        if: success()
        run: |
          DTB_FILES=$(find out -name "*.dtb" -type f)
          if [ -n "$DTB_FILES" ]; then
            cat $DTB_FILES > out/arch/arm64/boot/dtb.img
            echo "dtb.img 大小: $(wc -c < out/arch/arm64/boot/dtb.img) 字节"
          else
            echo "❌ 没有 DTB 文件"
            exit 1
          fi

      - name: 📦 打包 boot.img
        if: success()
        run: |
          KERNEL=""
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            KERNEL="out/arch/arm64/boot/Image.gz"
          elif [ -f out/arch/arm64/boot/Image ]; then
            KERNEL="out/arch/arm64/boot/Image"
          else
            echo "❌ 没有内核镜像"
            exit 1
          fi
          
          mkbootimg \
            --kernel $KERNEL \
            --dtb out/arch/arm64/boot/dtb.img \
            --ramdisk ./ramdisk.cpio \
            --cmdline "androidboot.console=ttyMSM0 androidboot.hardware=qcom androidboot.boot_devices=soc/1da4000.ufshc msm_rtb.filter=0x37 ehci-hcd.park=3 service_locator.enable=1 swiotlb=2048 loop.max_part=7" \
            --base 0x00000000 \
            --pagesize 4096 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --kernel_offset 0x00008000 \
            --os_version 16.0.0 \
            --os_patch_level 2026-02 \
            --header_version 2 \
            --board chiron \
            -o out/arch/arm64/boot/boot.img
          
          echo "✅ boot.img 创建成功"

      - name: 📤 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            out/arch/arm64/boot/boot.img
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtb.img
            out/.config
