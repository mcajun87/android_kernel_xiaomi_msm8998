name: Build chiron Kernel - GCC方案二（调试模式）

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: '内核配置文件'
        default: 'msm-perf_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🛠️ 安装依赖
        run: |
          sudo apt update -y
          sudo apt install -y bc bison flex libssl-dev libelf-dev \
          make gcc-12-aarch64-linux-gnu git wget libncurses5-dev \
          libncursesw5-dev xz-utils liblz4-tool libtinfo5 cpio \
          device-tree-compiler tree
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-12 100

      - name: 📥 下载 mkbootimg
        run: |
          git clone --depth=1 https://github.com/osm0sis/mkbootimg.git
          cd mkbootimg
          make CC=gcc
          sudo cp mkbootimg /usr/local/bin/
          cd .. && rm -rf mkbootimg

      - name: 📥 下载 LineageOS ramdisk
        run: |
          wget -O ramdisk.cpio "https://raw.githubusercontent.com/mcajun87/android_kernel_xiaomi_msm8998/lineage-23.2/.github/ramdisk.cpio"

      - name: 🔍 查看内核配置
        run: |
          echo "内核版本信息:"
          head -10 Makefile
          echo ""
          echo "可用的配置文件:"
          find arch/arm64/configs -name "*.config" -o -name "*defconfig*" | sort

      - name: ⚙️ 配置内核（记录详细日志）
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 1. 加载配置
          echo "加载配置: ${{ github.event.inputs.defconfig }}"
          make O=out ${{ github.event.inputs.defconfig }} 2>&1 | tee config.log
          
          # 2. 修改配置
          scripts/config --file out/.config -e CONFIG_KALLSYMS
          scripts/config --file out/.config -e CONFIG_KALLSYMS_ALL
          scripts/config --file out/.config -e CONFIG_MODULES
          scripts/config --file out/.config -e CONFIG_MODULE_SIG_FORCE
          scripts/config --file out/.config -e CONFIG_FTRACE
          scripts/config --file out/.config -e CONFIG_KPROBES
          scripts/config --file out/.config -e CONFIG_DEBUG_INFO
          scripts/config --file out/.config -e CONFIG_DEBUG_INFO_DWARF4
          scripts/config --file out/.config -d CONFIG_DEBUG_INFO_BTF
          
          # 3. 最终配置
          make O=out olddefconfig
          
          # 4. 显示关键配置
          echo "关键配置状态:"
          grep -E "CONFIG_(KALLSYMS|MODULES|DEBUG_INFO|BPF)" out/.config

      - name: ⚙️ 编译内核（单线程，便于调试）
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 先编译 DTB
          echo "编译 DTB..."
          make O=out -j1 dtbs 2>&1 | tee dtbs.log
          
          # 再编译内核
          echo "编译内核..."
          make O=out -j1 Image.gz 2>&1 | tee kernel.log
          
          # 检查结果
          echo "编译结果:"
          ls -la out/arch/arm64/boot/

      - name: 📦 收集 DTB 文件
        run: |
          echo "查找所有 DTB 文件:"
          find out -name "*.dtb" -type f | tee dtb-list.txt
          
          DTB_COUNT=$(cat dtb-list.txt | wc -l)
          if [ "$DTB_COUNT" -eq 0 ]; then
            echo "❌ 没有找到 DTB 文件"
            echo "检查 DTS 编译日志:"
            cat dtbs.log | grep -i error -A 5 -B 5 || echo "没有发现错误"
            exit 1
          fi
          
          echo "✅ 找到 $DTB_COUNT 个 DTB 文件"
          cat dtb-list.txt

      - name: 📦 创建 dtb.img
        run: |
          if [ -f out/arch/arm64/boot/dtb.img ]; then
            rm out/arch/arm64/boot/dtb.img
          fi
          
          # 方法1: 尝试使用 cat
          find out -name "*.dtb" -type f -exec cat {} \; > out/arch/arm64/boot/dtb.img
          echo "方法1完成，大小: $(wc -c < out/arch/arm64/boot/dtb.img) 字节"
          
          # 验证
          file out/arch/arm64/boot/dtb.img

      - name: 📦 打包 boot.img
        if: success()
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "❌ 内核镜像不存在"
            exit 1
          fi
          
          mkbootimg \
            --kernel out/arch/arm64/boot/Image.gz \
            --dtb out/arch/arm64/boot/dtb.img \
            --ramdisk ./ramdisk.cpio \
            --cmdline "androidboot.console=ttyMSM0 androidboot.hardware=qcom androidboot.boot_devices=soc/1da4000.ufshc msm_rtb.filter=0x37 ehci-hcd.park=3 service_locator.enable=1 swiotlb=2048 loop.max_part=7" \
            --base 0x00000000 \
            --pagesize 4096 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --kernel_offset 0x00008000 \
            --os_version 16.0.0 \
            --os_patch_level 2026-02 \
            --header_version 2 \
            --board chiron \
            -o out/arch/arm64/boot/boot.img
          
          echo "✅ boot.img 创建成功"

      - name: 📤 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: |
            out/arch/arm64/b
