name: Build MIX2 4.4 Kernel - APatch + KPM + SUSFS

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: '版本后缀 (如: v1.0-apatch-kpm-susfs)'
        required: true
        default: 'mix2-apatch-kpm-susfs'

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y bc bison flex libssl-dev make gcc-aarch64-linux-gnu zip git

      - name: Integrate APatch (with KPM)
        run: |
          # 拉取 APatch 官方仓库（默认已集成 KPM 支持）
          git clone https://github.com/bmax120/APatch --depth=1
          
          # 复制 APatch + KPM 核心代码
          cp -r APatch/kernel_apatch include/
          cp -r APatch/drivers/apatch drivers/
          
          # 启用 APatch + KPM 配置
          echo "CONFIG_APATCH=y" >> arch/arm64/configs/chiron_defconfig
          echo "CONFIG_APATCH_KPM=y" >> arch/arm64/configs/chiron_defconfig
          echo "CONFIG_APATCH_DEBUG=n" >> arch/arm64/configs/chiron_defconfig

      - name: Integrate SUSFS
        run: |
          # 拉取 SUSFS 补丁仓库
          git clone https://github.com/ShirkNeko/susfs4ksu --depth=1
          
          # 应用 SUSFS 补丁（优先使用 4.4 专用补丁）
          if [ -f susfs4ksu/patches/4.4/add_susfs.patch ]; then
            patch -p1 < susfs4ksu/patches/4.4/add_susfs.patch
          else
            echo "未找到 4.4 专用补丁，尝试使用通用补丁"
            patch -p1 < susfs4ksu/patches/add_susfs.patch || true
          fi
          
          # 启用 SUSFS 配置
          echo "CONFIG_SUSFS=y" >> arch/arm64/configs/chiron_defconfig
          echo "CONFIG_SUSFS_DEBUG=n" >> arch/arm64/configs/chiron_defconfig

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make clean && make mrproper
          make chiron_defconfig
          make -j$(nproc) Image.gz-dtb

          if [ ! -f "arch/arm64/boot/Image.gz-dtb" ]; then
            echo "编译失败：未生成 Image.gz-dtb"
            exit 1
          fi

      - name: Pack with AnyKernel3 (chiron)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b chiron --depth=1
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/zImage
          cd AnyKernel3 && zip -r9 ../MIX2-Kernel-APatch-KPM-SUSFS-${{ inputs.suffix }}.zip .

      - name: Upload Final Zip
        uses: actions/upload-artifact@v3
        with:
          name: MIX2-APatch-KPM-SUSFS-${{ inputs.suffix }}
          path: "MIX2-Kernel-APatch-KPM-SUSFS-*.zip"

