name: Build chiron Kernel - 诊断模式

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: '内核配置文件'
        default: 'vendor/xiaomi/chiron.config'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🛠️ 安装依赖
        run: |
          sudo apt update -y
          sudo apt install -y bc bison flex libssl-dev libelf-dev \
          make gcc-12-aarch64-linux-gnu git wget libncurses5-dev \
          libncursesw5-dev xz-utils liblz4-tool libtinfo5 cpio \
          device-tree-compiler tree
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-12 100

      - name: 📥 下载 mkbootimg
        run: |
          git clone --depth=1 https://github.com/osm0sis/mkbootimg.git
          cd mkbootimg
          make CC=gcc
          sudo cp mkbootimg /usr/local/bin/
          cd .. && rm -rf mkbootimg

      - name: 📥 下载 LineageOS ramdisk
        run: |
          wget -O ramdisk.cpio "https://raw.githubusercontent.com/mcajun87/android_kernel_xiaomi_msm8998/lineage-23.2/.github/ramdisk.cpio"

      - name: 🔍 查看内核版本和配置
        run: |
          echo "=== 内核版本 ==="
          head -10 Makefile
          echo ""
          echo "=== 可用的配置文件 ==="
          find arch/arm64/configs -type f | sort
          echo ""
          echo "=== 检查 chiron.config ==="
          cat arch/arm64/configs/vendor/xiaomi/chiron.config || echo "chiron.config 不存在"

      - name: ⚙️ 配置内核
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 加载配置
          echo "加载配置: ${{ github.event.inputs.defconfig }}"
          make O=out ${{ github.event.inputs.defconfig }}
          
          # 开启基本选项
          scripts/config --file out/.config -e CONFIG_KALLSYMS
          scripts/config --file out/.config -e CONFIG_KALLSYMS_ALL
          scripts/config --file out/.config -e CONFIG_MODULES
          
          # 禁用有问题的选项
          scripts/config --file out/.config -d CONFIG_BPF
          scripts/config --file out/.config -d CONFIG_BPF_SYSCALL
          scripts/config --file out/.config -d CONFIG_DEBUG_INFO_BTF
          
          # 显示最终配置
          echo "=== 关键配置 ==="
          grep -E "CONFIG_(KALLSYMS|MODULES|BPF|DEBUG_INFO)" out/.config || true

      - name: ⚙️ 编译内核（保存完整日志）
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 编译并保存所有输出
          make O=out -j$(nproc) 2>&1 | tee full-build.log
          
          # 检查结果
          echo "=== 编译结果 ==="
          ls -la out/arch/arm64/boot/ || echo "boot目录不存在"
          
          # 查找错误
          echo "=== 错误摘要 ==="
          grep -i error full-build.log | tail -20 || echo "没有发现错误"
          grep -i warning full-build.log | tail -20 || echo "没有发现警告"

      - name: 📤 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            full-build.log
            out/.config
