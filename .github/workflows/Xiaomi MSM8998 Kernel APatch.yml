name: Build MIX2 4.4 Kernel - APatch Only

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: '版本后缀 (如: v1.0-apatch)'
        required: true
        default: 'mix2-apatch'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make gcc-aarch64-linux-gnu zip git

      - name: Integrate APatch (only)
        run: |
          git clone https://github.com/bmax120/APatch.git --depth=1
          cp -r APatch/kernel_apatch include/
          cp -r APatch/drivers/apatch drivers/
          echo "CONFIG_APATCH=y" >> arch/arm64/configs/chiron_defconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make clean
          make chiron_defconfig
          make -j$(nproc) Image.gz-dtb

      - name: Pack with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b chiron --depth=1
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/zImage
          cd AnyKernel3
          zip -r9 ../MIX2-Kernel-APatch-${{ inputs.suffix }}.zip .

      - name: Upload zip
        uses: actions/upload-artifact@v3
        with:
          name: MIX2-Kernel-APatch-${{ inputs.suffix }}
          path: "MIX2-Kernel-APatch-*.zip"

