name: Build Kernel for chiron (LineageOS 23.2)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lineage-23.2
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang-12 git gcc-aarch64-linux-gnu-9 binutils-aarch64-linux-gnu
      - name: Build kernel
        run: |
          make ARCH=arm64 chiron_defconfig
          make ARCH=arm64 CC=clang-12 CROSS_COMPILE=aarch64-linux-gnu- -j4 Image.gz-dtb
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-chiron
          path: arch/arm64/boot/Image.gz-dtb
