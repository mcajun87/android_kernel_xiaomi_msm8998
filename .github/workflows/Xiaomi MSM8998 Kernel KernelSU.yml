name: Build Xiaomi MSM8998 Kernel 

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: '内核版本后缀 (如: v1.0-ksu)'
        required: true
        default: 'mix2-4.4-custom'
      build_type:
        description: '构建类型 (release/test)'
        required: true
        default: 'release'
      ksu_version:
        description: 'KernelSU 版本 (空则不集成)'
        required: false
        default: 'v10.0'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 缓存工具链与 AnyKernel3
        uses: actions/cache@v3
        with:
          path: |
            toolchain
            AnyKernel3
          key: ${{ runner.os }}-msm8998-kernel-deps

      - name: 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison flex libssl-dev rsync zip unzip \
            git-lfs curl wget make gcc gcc-aarch64-linux-gnu

      - name: 准备工具链
        run: |
          if [ ! -d toolchain ]; then
            mkdir -p toolchain
            # 下载适配 4.4 内核的 Clang/GCC (示例使用官方预编译工具链)
            wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/LA.UM.9.1/r1.12.tar.gz -O toolchain/gcc.tar.gz
            tar -xzf toolchain/gcc.tar.gz -C toolchain/
            rm toolchain/gcc.tar.gz
          fi
          echo "TOOLCHAIN_PATH=$PWD/toolchain/bin" >> $GITHUB_ENV

      - name: 集成 KernelSU (可选)
        if: ${{ github.event.inputs.ksu_version != '' }}
        run: |
          # 下载 KernelSU 模板并应用补丁
          git clone https://github.com/tiann/KernelSU.git kernelsu_source -b ${{ github.event.inputs.ksu_version }} --depth 1
          cp -r kernelsu_source/kernelsu include/
          cp -r kernelsu_source/drivers/kernelsu drivers/
          echo "CONFIG_KSU=y" >> arch/arm64/configs/chiron_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/chiron_defconfig

      - name: 内核编译配置
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_COMPAT=arm-linux-androideabi-
          export PATH=${{ env.TOOLCHAIN_PATH }}:$PATH

          make clean
          make mrproper
          make chiron_defconfig

      - name: 开始编译内核
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export PATH=${{ env.TOOLCHAIN_PATH }}:$PATH

          make -j$(nproc) Image.gz-dtb 2> build_error.log || true

          if [ ! -f arch/arm64/boot/Image.gz-dtb ]; then
            echo "内核编译失败！"
            cat build_error.log
            exit 1
          fi
          echo "内核编译成功！"

      - name: 准备 AnyKernel3 打包
        run: |
          if [ ! -d AnyKernel3 ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git -b chiron --depth 1
          fi
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/zImage
          cd AnyKernel3
          zip -r9 ../MIX2-Kernel-${{ github.event.inputs.suffix }}.zip ./*
          cd ..

      - name: 整理产物
        run: |
          mkdir -p output
          cp MIX2-Kernel-${{ github.event.inputs.suffix }}.zip output/
          echo "KERNEL_ZIP=MIX2-Kernel-${{ github.event.inputs.suffix }}.zip" >> $GITHUB_ENV

      - name: 上传构建产物
        uses: actions/upload-artifact@v3
        with:
          name: Kernel-Output-${{ github.event.inputs.suffix }}
          path: output/*

      - name: 发布正式版本 (release 模式)
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.suffix }}
          name: 小米 MIX2 内核 - ${{ github.event.inputs.suffix }}
          body: |
            ## 构建信息
            - 内核版本：Linux 4.4.302 (MSM8998)
            - 构建类型：${{ github.event.inputs.build_type }}
            - 是否集成 KernelSU：${{ github.event.inputs.ksu_version != '' && '是' || '否' }}
            - 编译日志：详见 Artifact
          files: output/${{ env.KERNEL_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
